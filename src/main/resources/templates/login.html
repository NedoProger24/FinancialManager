<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <link rel="stylesheet" th:href="@{/css/style.css}">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login</title>
    </head>
    <body>
        <h2>Вход в Financial Manager</h2>
        <div class="login-container">
            <form class="login-form" th:action="@{/login}" method="post">
                <link rel="stylesheet" href="../static/css/style.css">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="input-group" style="width: 100%;">
                    <label class="max-width">Логин:</label>
                    <input class="max-width" type="text" name="username" required>
                </div>
                <div class="input-group" style="width: 100%;">
                    <label class="max-width">Пароль:</label>
                    <input class="max-width" type="password" name="password" required>
                </div>
                <div th:if="${param.error}" class="error">
                    <label class="error-text">Неверный логин или пароль!</label>
                </div>
                <div class="centered-div">
                    <a href="/login">
                        <button class="flat-button" type="submit">Войти</button>
                    </a>
                </div>
                <div class="centered-div">
                    <a href="/registration">
                        Регистрация
                    </a>
                </div>
                <div th:if="${param.logout}" class="success">
                    <label>Вы успешно вышли из системы</label>
                </div>
            </form>
        </div>
    </body>
</html>
